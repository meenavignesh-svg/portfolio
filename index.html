<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Meena Vignesh M — Interactive 3D Portfolio</title>
<meta name="description" content="Drive through the portfolio of Meena Vignesh M — Biotechnology, Bioinformatics, AI for Biology."/>
<meta name="theme-color" content="#1a1a2e"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-weight='700' font-size='14' fill='%23fff'%3EMV%3C/text%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f1f5f9}
canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.top-bar{position:absolute;top:0;left:0;right:0;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(15,23,42,.85),transparent)}
.logo{font-weight:700;font-size:1rem}.logo span{color:#38bdf8}
.hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.85);border:1px solid rgba(56,189,248,.3);padding:.65rem 1.2rem;border-radius:999px;font-size:.8rem;color:#94a3b8;font-family:JetBrains Mono,monospace;white-space:nowrap;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.85}50%{opacity:1}}
.panel{pointer-events:auto;position:absolute;top:50%;right:1.25rem;transform:translateY(-50%) translateX(20px);width:min(360px,calc(100vw - 2rem));max-height:80vh;overflow-y:auto;background:rgba(15,23,42,.92);backdrop-filter:blur(20px);border:1px solid rgba(56,189,248,.25);border-radius:16px;padding:1.35rem;box-shadow:0 20px 50px rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s,transform .35s}
.panel.open{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0)}
.panel h2{font-size:1.15rem;font-weight:700;margin-bottom:.35rem}
.panel .meta{font-size:.72rem;color:#38bdf8;font-family:JetBrains Mono,monospace;margin-bottom:.75rem}
.panel p{font-size:.88rem;color:#94a3b8;line-height:1.6;margin-bottom:.85rem}
.panel .tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem}
.panel .tag{font-size:.65rem;padding:.15rem .45rem;border-radius:5px;background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.2)}
.panel a{display:inline-flex;font-size:.85rem;font-weight:600;color:#0ea5e9;text-decoration:none;margin-right:.75rem}
.panel a:hover{text-decoration:underline}
.panel-close{position:absolute;top:.75rem;right:.75rem;width:32px;height:32px;border:1px solid rgba(148,163,184,.3);background:transparent;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:1.1rem}
.panel-close:hover{color:#fff;border-color:#38bdf8}
.mobile-controls{display:none;position:absolute;bottom:5rem;left:0;right:0;justify-content:space-between;padding:0 1.25rem;pointer-events:none}
.joy,.btns{pointer-events:auto;display:flex;gap:.5rem}
.ctrl-btn{width:56px;height:56px;border-radius:14px;border:1px solid rgba(56,189,248,.35);background:rgba(15,23,42,.75);color:#e2e8f0;font-size:1.25rem;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation}
.ctrl-btn:active{background:rgba(56,189,248,.25)}
.loading{position:fixed;inset:0;z-index:100;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .6s,visibility .6s}
.loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loading h1{font-size:1.5rem;font-weight:800}.loading h1 span{color:#38bdf8}
.loading p{color:#64748b;font-size:.9rem}
.spinner{width:40px;height:40px;border:3px solid rgba(56,189,248,.2);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.hint{font-size:.65rem;bottom:7.5rem}.mobile-controls{display:flex}.panel{right:.75rem;left:.75rem;width:auto;top:auto;bottom:7.5rem;transform:none;max-height:40vh}.panel.open{transform:none}}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div><h1>Meena <span>Vignesh</span></h1><p>Loading 3D portfolio…</p></div>
<div id="ui">
<div class="top-bar"><div class="logo">Meena <span>Vignesh</span> · 3D Portfolio</div><div style="font-size:.75rem;color:#64748b;font-family:JetBrains Mono,monospace">WASD / Arrows to drive</div></div>
<div class="hint" id="hint">Drive to the glowing markers · Press E or click to open</div>
<div class="panel" id="panel"><button class="panel-close" id="panelClose">×</button><h2 id="pTitle"></h2><div class="meta" id="pMeta"></div><p id="pBody"></p><div class="tags" id="pTags"></div><div id="pLinks"></div></div>
<div class="mobile-controls"><div class="joy"><button class="ctrl-btn" data-key="a">◀</button><button class="ctrl-btn" data-key="s">▼</button><button class="ctrl-btn" data-key="w">▲</button><button class="ctrl-btn" data-key="d">▶</button></div><div class="btns"><button class="ctrl-btn" data-key="e" style="width:64px">E</button></div></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const content = {
  about: { title:'About Me', meta:'B.Tech Biotechnology · 3rd Semester', body:'Sethu Institute of Technology (2025–2029). CGPA 7.4/10. Focused on Bioengineering, Bioinformatics, Computational Biology, and AI for Biology.', tags:['Bioengineering','Bioinformatics','AI for Biology','Python'], links:[{label:'GitHub',href:'https://github.com/meenavignesh-svg'},{label:'LinkedIn',href:'https://linkedin.com/in/meena-vignesh-m-310664380'}] },
  margots: { title:'MARGOTS', meta:'Bioinformatics · Python · AI Agents', body:'AI-native genomic workflow platform. Turns experimental intent and sequencing data into structured pipelines, QC, analysis, and reports.', tags:['Python','Bioinformatics','AI Agents'], links:[{label:'View repository',href:'https://github.com/meenavignesh-svg/margots'}] },
  peg: { title:'PEG Biodegradation', meta:'SIH 2026 · Clean & Green · Team Marge Organics', body:'Interactive process demo for PEG wastewater treatment: feed → biochar-hydrogel → bacterial consortium → treated water.', tags:['SIH 2026','Environmental Biotech'], links:[{label:'Repository',href:'https://github.com/meenavignesh-svg/PEG-BIODEGRADATION'},{label:'Live demo',href:'https://meenavignesh-svg.github.io/PEG-BIODEGRADATION/'}] },
  aegis: { title:'Aegis Bio-Node', meta:'Bioengineering concept', body:'Conceptual next-gen bioreactor exploring non-Euclidean geometry and organ-mimetic fluid dynamics.', tags:['Bioengineering','Design'], links:[{label:'View repository',href:'https://github.com/meenavignesh-svg/AEGIS-BIO-NODE'}] },
  contact: { title:"Let's connect", meta:'Open to research internships', body:'Reach out for collaborations in Bioengineering, Bioinformatics, and AI for Biology. Tamil Nadu, India.', tags:['Email','WhatsApp','GitHub','LinkedIn'], links:[{label:'Email',href:'mailto:meenavignesh6789@gmail.com'},{label:'WhatsApp',href:'https://wa.me/919791361692'},{label:'GitHub',href:'https://github.com/meenavignesh-svg'},{label:'LinkedIn',href:'https://linkedin.com/in/meena-vignesh-m-310664380'},{label:'Call',href:'tel:+919791361692'}] }
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 25, 70);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x88aaff, 0x223344, 0.7));
const sun = new THREE.DirectionalLight(0xfff5e6, 1.1);
sun.position.set(12, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
sun.shadow.camera.left = sun.shadow.camera.bottom = -25;
sun.shadow.camera.right = sun.shadow.camera.top = 25;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x4060a0, 0.35));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({color:0x1a2740, roughness:0.9, metalness:0.05}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(80, 40, 0x2a4060, 0x1e3050);
grid.position.y = 0.01; scene.add(grid);

for (let i = 0; i < 12; i++) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random()*0.2, 12, 12), new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(0.55 + Math.random()*0.15, 0.7, 0.55), emissive: 0x0ea5e9, emissiveIntensity: 0.3}));
  o.position.set((Math.random()-0.5)*50, 0.5 + Math.random()*4, (Math.random()-0.5)*50);
  scene.add(o);
}

const stations = [];
function makeStation(x, z, color, id, label, height=2.2) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(2.2, height, 2.2, 2, 0.15), new THREE.MeshStandardMaterial({color, roughness:0.4, metalness:0.3}));
  body.position.y = height/2; body.castShadow = true; body.receiveShadow = true; group.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.9, 32), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.45, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.03; group.add(ring);
  const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.8}));
  beacon.position.y = height + 0.4; group.add(beacon);
  const light = new THREE.PointLight(color, 1.2, 8); light.position.y = height + 0.5; group.add(light);
  group.position.set(x, 0, z); group.userData = {id, label, ring, beacon, height}; scene.add(group); stations.push(group); return group;
}
makeStation(-8, -6, 0x0ea5e9, 'about', 'About', 2.5);
makeStation(8, -8, 0x22d3ee, 'margots', 'MARGOTS', 3);
makeStation(10, 4, 0x34d399, 'peg', 'PEG Bio', 2.4);
makeStation(-6, 8, 0xa78bfa, 'aegis', 'Aegis', 2.8);
makeStation(0, 12, 0xf472b6, 'contact', 'Contact', 2.2);

const car = new THREE.Group();
const chassis = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.35, 2.0, 2, 0.08), new THREE.MeshStandardMaterial({color:0x38bdf8, roughness:0.35, metalness:0.5}));
chassis.position.y = 0.35; chassis.castShadow = true; car.add(chassis);
const cabin = new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.35, 1.0, 2, 0.08), new THREE.MeshStandardMaterial({color:0x0ea5e9, roughness:0.3, metalness:0.4}));
cabin.position.set(0, 0.62, -0.15); cabin.castShadow = true; car.add(cabin);
const wheelGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.15, 12);
const wheelMat = new THREE.MeshStandardMaterial({color:0x1e293b, roughness:0.9});
[[-0.5,0.22,0.55],[0.5,0.22,0.55],[-0.5,0.22,-0.55],[0.5,0.22,-0.55]].forEach(([x,y,z])=>{ const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z = Math.PI/2; w.position.set(x,y,z); w.castShadow = true; car.add(w); });
const hl = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.08,0.05), new THREE.MeshStandardMaterial({color:0xfff7ed, emissive:0xfff7ed, emissiveIntensity:1}));
hl.position.set(-0.3, 0.35, 1.02); car.add(hl); const hr = hl.clone(); hr.position.x = 0.3; car.add(hr);
car.position.set(0, 0, 2); scene.add(car);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.querySelectorAll('.ctrl-btn').forEach(btn => {
  const k = btn.dataset.key;
  const on = e => { e.preventDefault(); keys[k] = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off);
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});

let speed = 0;
const maxSpeed = 0.18, accel = 0.008, friction = 0.96, turnSpeed = 0.045;
const panel = document.getElementById('panel');
let activeStation = null, panelOpen = false;

function openPanel(id) {
  const c = content[id]; if (!c) return;
  document.getElementById('pTitle').textContent = c.title;
  document.getElementById('pMeta').textContent = c.meta;
  document.getElementById('pBody').textContent = c.body;
  document.getElementById('pTags').innerHTML = c.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('pLinks').innerHTML = c.links.map(l => `<a href="${l.href}" target="_blank" rel="noopener">${l.label} →</a>`).join('');
  panel.classList.add('open'); panelOpen = true;
  document.getElementById('hint').textContent = 'Press E or × to close';
}
function closePanel() {
  panel.classList.remove('open'); panelOpen = false;
  document.getElementById('hint').textContent = 'Drive to the glowing markers · Press E or click to open';
}
document.getElementById('panelClose').addEventListener('click', closePanel);
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'e' || e.key === 'Enter') {
    if (panelOpen) closePanel();
    else if (activeStation) openPanel(activeStation.userData.id);
  }
  if (e.key === 'Escape') closePanel();
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(stations, true);
  if (hits.length) {
    let obj = hits[0].object;
    while (obj && !obj.userData.id) obj = obj.parent;
    if (obj?.userData?.id) openPanel(obj.userData.id);
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  let throttle = 0, turn = 0;
  if (keys['w'] || keys['arrowup']) throttle = 1;
  if (keys['s'] || keys['arrowdown']) throttle = -0.6;
  if (keys['a'] || keys['arrowleft']) turn = 1;
  if (keys['d'] || keys['arrowright']) turn = -1;
  speed += throttle * accel; speed *= friction;
  speed = Math.max(-maxSpeed*0.5, Math.min(maxSpeed, speed));
  if (Math.abs(speed) > 0.002) car.rotation.y += turn * turnSpeed * (speed > 0 ? 1 : -1);
  car.position.x += Math.sin(car.rotation.y) * speed;
  car.position.z += Math.cos(car.rotation.y) * speed;
  car.position.x = Math.max(-28, Math.min(28, car.position.x));
  car.position.z = Math.max(-28, Math.min(28, car.position.z));
  const desired = new THREE.Vector3(car.position.x - Math.sin(car.rotation.y) * 7, 5.0, car.position.z - Math.cos(car.rotation.y) * 7);
  camera.position.lerp(desired, 0.06);
  camera.lookAt(car.position.x, 0.8, car.position.z);
  let nearest = null, nearestDist = 4;
  stations.forEach(s => {
    const d = car.position.distanceTo(s.position);
    if (s.userData.ring) s.userData.ring.material.opacity = 0.4 + Math.sin(t * 3 + s.position.x) * 0.15;
    if (d < nearestDist) { nearestDist = d; nearest = s; }
  });
  activeStation = nearest;
  if (nearest && !panelOpen) document.getElementById('hint').textContent = `Near ${nearest.userData.label} · Press E to open`;
  else if (!panelOpen) document.getElementById('hint').textContent = 'Drive to the glowing markers · Press E or click to open';
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setTimeout(() => { document.getElementById('loading').classList.add('hide'); animate(); }, 800);
</script>
</body>
</html>
