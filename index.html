renderer.domElement.addEventListener('click',()=>{if(!controls.isLocked&&!panelOpen)controls.lock();});
const panel=document.getElementById('panel');let panelOpen=false,nearestId=null;
function openPanel(id){const c=content[id];if(!c)return;document.getElementById('pTitle').textContent=c.title;document.getElementById('pMeta').textContent=c.meta;document.getElementById('pBody').textContent=c.body;document.getElementById('pSkills').innerHTML=(c.skills||[]).map(s=>`<span class="skill-chip">${s}</span>`).join('');document.getElementById('pTags').innerHTML=(c.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');document.getElementById('pLinks').innerHTML=(c.links||[]).map(l=>`<a href="${l.href}" target="_blank" rel="noopener">${l.label} →</a>`).join('');panel.classList.add('open');panelOpen=true;if(controls.isLocked)controls.unlock();document.getElementById('hint').textContent='Press E or × to close';}
function closePanel(){panel.classList.remove('open');panelOpen=false;document.getElementById('hint').textContent='Walk to blue rings · Press E to open';}
document.getElementById('panelClose').addEventListener('click',closePanel);
window.addEventListener('keydown',e=>{if(e.code==='KeyE'||e.code==='Enter'){if(panelOpen)closePanel();else if(nearestId)openPanel(nearestId);}if(e.code==='Escape')closePanel();});
const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{if(panelOpen)return;pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const meshes=[];interactables.forEach(g=>g.traverse(c=>{if(c.isMesh)meshes.push(c);}));const hits=raycaster.intersectObjects(meshes,false);if(hits.length){let o=hits[0].object;while(o&&!o.userData.stationId)o=o.parent;if(o?.userData?.stationId)openPanel(o.userData.stationId);}});
const clock=new THREE.Clock();const walkSpeed=4.0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;scene.traverse(obj=>{if(obj.userData.pulse)obj.material.opacity=obj.userData.baseOpacity+Math.sin(t*2.5+obj.position.x)*0.12;});if(controls.isLocked&&!panelOpen){const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();let mx=0,mz=0;if(keys['KeyW']||keys['ArrowUp']){mx+=forward.x;mz+=forward.z;}if(keys['KeyS']||keys['ArrowDown']){mx-=forward.x;mz-=forward.z;}if(keys['KeyA']||keys['ArrowLeft']){mx-=right.x;mz-=right.z;}if(keys['KeyD']||keys['ArrowRight']){mx+=right.x;mz+=right.z;}const len=Math.hypot(mx,mz)||1;camera.position.x+=(mx/len)*walkSpeed*dt;camera.position.z+=(mz/len)*walkSpeed*dt;camera.position.x=Math.max(-roomW/2+0.5,Math.min(roomW/2-0.5,camera.position.x));camera.position.z=Math.max(-roomD/2+0.5,Math.min(roomD/2-0.5,camera.position.z));camera.position.y=1.65;}let best=null,bestD=2.6;interactables.forEach(g=>{const d=camera.position.distanceTo(g.position);if(d<bestD){bestD=d;best=g;}});nearestId=best?best.userData.stationId:null;if(!panelOpen){if(best)document.getElementById('hint').textContent=`Near: ${best.userData.label} · Press E`;else document.getElementById('hint').textContent=controls.isLocked?'Walk to blue rings under equipment':'Click lab to look · WASD to walk';}renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
setTimeout(()=>{document.getElementById('loading').classList.add('hide');animate();},1000);
</script>
</body>
</html>
