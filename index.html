makeInstrument(3.2,-2.95,'peg','PEG Bio');
makeFlasks(-3.95,-0.5,'aegis','Aegis');
makePC(-3.95,1.2,'rosalind','Rosalind',Math.PI/2);
makeInstrument(3.95,-0.5,'codealpha','CodeAlpha');
makePC(3.95,1.2,'sih','SIH AI',-Math.PI/2);
makeBoard(-1.5,2.95,'experience','Experience');
makePC(1.2,2.95,'contact','Contact');
const controls=new PointerLockControls(camera,document.body);const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;});window.addEventListener('keyup',e=>{keys[e.code]=false;});
document.querySelectorAll('.ctrl-btn').forEach(btn=>{const map={w:'KeyW',a:'KeyA',s:'KeyS',d:'KeyD',e:'KeyE'};const code=map[btn.dataset.key];const on=e=>{e.preventDefault();keys[code]=true;};const off=e=>{e.preventDefault();keys[code]=false;};btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off);btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);});
renderer.domElement.addEventListener('click',()=>{if(!controls.isLocked&&!panelOpen)controls.lock();});
const panel=document.getElementById('panel');let panelOpen=false,nearestId=null;
function openPanel(id){const c=content[id];if(!c)return;document.getElementById('pTitle').textContent=c.title;document.getElementById('pMeta').textContent=c.meta;document.getElementById('pBody').textContent=c.body;document.getElementById('pSkills').innerHTML=(c.skills||[]).map(s=>`<span class="skill-chip">${s}</span>`).join('');document.getElementById('pTags').innerHTML=(c.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('');document.getElementById('pLinks').innerHTML=(c.links||[]).map(l=>`<a href="${l.href}" target="_blank" rel="noopener">${l.label} →</a>`).join('');panel.classList.add('open');panelOpen=true;if(controls.isLocked)controls.unlock();document.getElementById('hint').textContent='E or × to close';}
function closePanel(){panel.classList.remove('open');panelOpen=false;document.getElementById('hint').textContent='Walk to blue rings · E';}
document.getElementById('panelClose').addEventListener('click',closePanel);
window.addEventListener('keydown',e=>{if(e.code==='KeyE'||e.code==='Enter'){if(panelOpen)closePanel();else if(nearestId)openPanel(nearestId);}if(e.code==='Escape')closePanel();});
const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{if(panelOpen)return;pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const meshes=[];interactables.forEach(g=>g.traverse(c=>{if(c.isMesh)meshes.push(c);}));const hits=raycaster.intersectObjects(meshes,false);if(hits.length){let o=hits[0].object;while(o&&!o.userData.stationId)o=o.parent;if(o?.userData?.stationId)openPanel(o.userData.stationId);}});
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;scene.traverse(o=>{if(o.userData.pulse)o.material.opacity=o.userData.baseOpacity+Math.sin(t*2.8)*0.12;});if(controls.isLocked&&!panelOpen){const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();let mx=0,mz=0;if(keys['KeyW']||keys['ArrowUp']){mx+=f.x;mz+=f.z;}if(keys['KeyS']||keys['ArrowDown']){mx-=f.x;mz-=f.z;}if(keys['KeyA']||keys['ArrowLeft']){mx-=r.x;mz-=r.z;}if(keys['KeyD']||keys['ArrowRight']){mx+=r.x;mz+=r.z;}const len=Math.hypot(mx,mz)||1;camera.position.x+=(mx/len)*3.5*dt;camera.position.z+=(mz/len)*3.5*dt;camera.position.x=Math.max(-W/2+0.4,Math.min(W/2-0.4,camera.position.x));camera.position.z=Math.max(-D/2+0.4,Math.min(D/2-0.4,camera.position.z));camera.position.y=1.55;}let best=null,bestD=2.2;interactables.forEach(g=>{const d=camera.position.distanceTo(g.position);if(d<bestD){bestD=d;best=g;}});nearestId=best?best.userData.stationId:null;if(!panelOpen)document.getElementById('hint').textContent=best?`Near: ${best.userData.label} · E`:(controls.isLocked?'Walk to blue rings':'Click · WASD · E');renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
requestAnimationFrame(()=>{document.getElementById('loading').classList.add('hide');animate();});
</script>
