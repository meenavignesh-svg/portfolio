name: Harden lab entrance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make entrance physically passable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Make the architectural doorway substantially wider and taller.
          s=s.replace("const DOOR_W=1.55, DOOR_H=2.35;", "const DOOR_W=2.20, DOOR_H=2.45;", 1)
          # Start clearly outside the entrance, facing directly toward it.
          s=s.replace("camera.position.set(0,1.55,4.75);", "camera.position.set(0,1.55,5.60);", 1)
          # Never trap the player against the front wall. The doorway is an actual opening,
          # and the entrance itself is not a collision object.
          s=s.replace("camera.position.z=Math.max(-D/2+0.4,Math.min(doorOpen?D/2+0.75:D/2+0.55,camera.position.z));", "camera.position.z=Math.max(-D/2+0.4,Math.min(D/2+2.0,camera.position.z));", 1)
          # Auto-open when approaching the entrance, so entering does not depend on a key event.
          marker="const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;"
          replacement="const dt=Math.min(clock.getDelta(),0.05);const t=clock.elapsedTime;if(labDoor){const nearDoor=Math.abs(camera.position.x)<1.75 && Math.abs(camera.position.z-D/2)<2.2;if(nearDoor){doorOpen=true;doorTarget=-Math.PI/2;}else if(camera.position.z<D/2-0.8){doorOpen=false;doorTarget=0;}const leaf=labDoor.userData.leaf;if(leaf)leaf.rotation.y+=(doorTarget-leaf.rotation.y)*Math.min(1,dt*8);}"
          if marker in s and "if(labDoor){const nearDoor" not in s:
              s=s.replace(marker,replacement,1)
          # Keep the instruction unambiguous.
          s=s.replace("Click · WASD · E at blue rings", "Click · WASD · Walk to the lab entrance", 1)
          s=s.replace("document.getElementById('hint').textContent=doorOpen?'Door open · Walk inside':'Door closed · E to open';", "document.getElementById('hint').textContent=doorOpen?'Entrance open · Walk inside':'Walk to the entrance';", 1)
          p.write_text(s)
          PY
      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make lab entrance physically passable"
          git push
